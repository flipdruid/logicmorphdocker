{% extends 'dashboard/_base.html' %}

{% block content %}
    <!-- Begin Page Content -->
    <div class="container">

        <!-- Page Heading -->
        <div class="text-center mt-3 mb-3">
          <h1 class="text-gray-800">Welcome to Chart</h1>        
        </div>          

        <!-- Main Content Here -->
        <div class="row">
          <div class="col-2"></div>
            <div class="col-10">
                <div class="mx-auto">
                    <canvas id="myChart"></canvas>
                </div>
            </div>
        </div>
        
        
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <script>
    const ctx = document.getElementById('myChart');
  
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
        
        datasets: [{
          label: '# of Votes',
          backgroundColor: ['rgba(255, 0, 51, 0.5)', 'rgba(34, 0, 255, 0.5)', 'rgba(248, 255, 0, 0.5)', 
                            'rgba(0, 255, 23, 0.5)', 'rgba(172, 0, 255, 0.5)', 'rgba(255, 119, 0, 0.5)'],
          data: [12, 19, 3, 5, 2, 3],
          borderWidth: 1
        }]
      },
      options: {
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });
  </script>
    <!-- /.container-fluid -->
{% endblock content %}

{% extends 'base.html' %}

{% block content %}
<div class="container pt-5 mb-5">

        <div class="col-md-3 "></div>
        <div class="col-md-6">
            <div class="error-template text-center ">

                <h2>500 Server Error</h2>

                    Sorry, an error has occured, Requested page server error!

            </div>
            <div class="col-md-3 "></div>
        </div>
    </div>
</div>
{% endblock %}

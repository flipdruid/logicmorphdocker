{% load static %}

<!DOCTYPE html>
<html lang="en-US" dir="ltr">
    <head>

        

        <!-- Fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
        <link href="https://fonts.cdnfonts.com/css/segoe-ui-4" rel="stylesheet">
        <link href="https://fonts.cdnfonts.com/css/proxima-nova-2" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans" rel="stylesheet">
        <link href="https://fonts.cdnfonts.com/css/helvetica-neue-9" rel="stylesheet">
        <link href="https://fonts.cdnfonts.com/css/noto-sans" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans" rel="stylesheet">
        <link href="https://fonts.cdnfonts.com/css/lato" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans" rel="stylesheet">
                
                
        <!-- Bootstrap CSS -->               
        <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
        <link rel="stylesheet" href="{% static 'css/custom.css' %}">
        <link rel="stylesheet" href="{% static 'css/media.css' %}">
        <link rel="stylesheet" href="{% static 'css/landinglight.css' %}">
        <link rel="stylesheet" href="{% static 'css/custom-extend.css' %}">

        {% if is_sblogin %}
            <link href="{% static 'dashboard/vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet" type="text/css">
            <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
                rel="stylesheet">
            <link href="{% static 'dashboard/css/sb-admin-2.min.css' %}" rel="stylesheet">
        {% endif %}
        
        <!-- <link rel="stylesheet" href="{% static 'css/custom-carousel.css' %}"> -->
        
        <!-- <script src="https://unpkg.com/@popperjs/core@2/dist/umd/popper.js"></script> -->
        <link href="{% static 'fontawesomefree/css/all.min.css' %}" rel="stylesheet" type="text/css">
        <script src="{% static 'fontawesomefree/js/all.min.js' %}"></script>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css"/>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>

        <title>
            {% block head_title %}{% endblock %}
        </title>

        <link rel="shortcut icon" type="image/jpg" href="{% static 'image/lm-logo100.png' %}"/>
    </head>
    <body id = "{{main_body_theme}}">
        
        {% include 'main/inc/navbar.html' %}
        <div class="undernav-border-bottom"></div>
        <main class="main" id="top">
            
            {% block content %}{% endblock %}        
        </main>
        {% include 'main/inc/footer.html' %} 
        <!-- Optional JavaScript -->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>        
        <script src = "{% static 'js/bootstrap.bundle.min.js' %}"></script>
        <script src = "{% static 'js/custom.js' %}"></script>  

        {% if is_sblogin %}
            <script src="{% static 'dashboard/vendor/jquery-easing/jquery.easing.min.js' %}"></script>
            <!-- Custom scripts for all pages-->
            <script src="{% static 'dashboard/js/sb-admin-2.min.js' %}"></script>

            <!-- Page level plugins -->
            <script src="{% static 'dashboard/vendor/chart.js/Chart.min.js' %}"></script>

            <!-- Page level custom scripts -->
            <script src="{% static 'dashboard/js/demo/chart-area-demo.js' %}"></script>
            <script src="{% static 'dashboard/js/demo/chart-pie-demo.js' %}"></script>
        {% endif %}
    </body>
</html>

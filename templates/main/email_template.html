<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="text-center"><h3>Logic Morph Registration</h3></title>
<style>
    @import url('https://fonts.cdnfonts.com/css/segoe-ui-4');
    .html-email-body {
        background-color: #087cfc;
        box-shadow: 0px 7px 30px -5px #519F08;
        max-width: 700px;
        min-height: 285px;
        max-height: 600px;
        border-radius: 30px;
    }

    .html-email-body img {
        width: 70px; 
        height: 70px;
    }

    .img-holder {
        text-align: center;
        align-self: center;
        align-items: center;
    }

    .img-holder span{
        vertical-align: middle;
        display: inline-block;
        font-weight: bold;
     }

     .row {
        display: flex;
        align-items: center;
        justify-content: center;
 
    }

    .column {
        flex: 50%;
        display: inline-block;
        
    }

    .insidebody {
        margin-left: 20px;
        margin-bottom: 10px;
    }

    .dividers {
        border-style: solid;
        border-bottom: wheat;
        border-width: thin;
        width: 95%;
        text-align: center;
        align-content: center;
        align-self: center;
        align-items: center;
        
    }

    .reg-button{
        font-family: 'Segoe UI';
        font-style: normal;
        font-weight: 700;
        font-size: 14px;
        line-height: 20px;
        color: #FFFFFF;
        width: 216px;
        height: 45px;
        background: #84D934;
        /* shadow_003 */   
        box-shadow: 0px 7px 30px -5px #519F08;
        border-radius: 100px;
        text-align: center;
        align-items: center;
        cursor: pointer !important;
    }

    .reg-button:hover{ 
        cursor: pointer;
    }
</style>
</head>
<body class="html-email-body" >  
    <div class="insidebody">
        <div class="row" style="text-align: center !important;">
            <div class="column" style="text-align: center !important;"><img src="https://logicmorph.herokuapp.com/static/image/lmlt.png" /></div>
            <div class="column" style="margin-top: 25px; text-align: center !important;"> <span> Logicmorph</span></div>
        
        </div>
        <div class="dividers"></div>
        <p>Hi {{fname}},</p>
        <!-- <p>Please click <a href="{{details}}">here</a> for the Registration page to continue.</p> -->
        <p>Please click the button below for the Registration page to continue.</p>
        <a href="{{details}}" ><button class="reg-button">Registration Link</button></a> 
        <p>Best regards,</p>
        <p>Logic Morph</p>
        </div>
    </div>
</body> 
<!-- JavaScript Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</html>

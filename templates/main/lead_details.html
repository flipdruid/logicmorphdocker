{% extends 'dashboard/_base.html' %}
{% block content %}
<div class="container-fluid">
    <div class="row">
       <div class="col-lg-4"></div>
           <div class="col-lg-4">
            <div class="card box-shadow text-center mt-5">
                <div class = "card-body">
                    <h4 class="lead"> <a class="text-dark" href="{% url 'lead_mail_view' lead.id %}">{{ lead.entity_name }}</a> <span class="badge badge-info">{{ lead.state }}</span></h4>
                    <medium class="text-muted">{{lead.first_name}} {{lead.last_name}}</medium>
                    <p><small class="text-muted">{{lead.email}}</small></p>

                    <div class="mt-2 text-center">
                        {% if user.is_staff %}
                        <div class="btn-group">
                            <a href="#" class="btn btn-sm btn-outline-primary" role="button" aria-pressed="true"><i class="fa-solid fa-eye"></i> View</a>                            
                                <a href="#" class="btn btn-sm btn-outline-primary" role="button" aria-pressed="true"><i class="fa-solid fa-pen-to-square"></i> Edit</a>
                                <a href="#" class="btn btn-sm btn-outline-primary" role="button" aria-pressed="true"><i class="fa-solid fa-trash-can"></i> Delete</a>                            
                        </div>
                        {% endif %}
                    </div>
                </div>
            </div>
            </div>
       <div class="col-lg-4"></div>
    </div>
</div>
{% endblock %}

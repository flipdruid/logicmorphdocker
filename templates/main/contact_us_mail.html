{% extends 'base.html' %}
{% load widget_tweaks %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container-fluid">
  <div class = "row ">
      <div class = "col-lg-3"></div>
      <div class = "col-lg-6">
        <h2 class="text-center text-primary mt-5">CONTACT US</h2>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <div class="form-group text-center">
                <button type="submit" class="btn btn-light border border-primary rounded"><i class="fa-solid fa-paper-plane"></i> Submit
                </button>
                <a href="{% url 'main' %}" class="btn btn-light border border-primary rounded"><i class="fa-solid fa-xmark"></i> Cancel</a>
            </div>
        </form>
      </div>
      <div class = "col-lg-3"></div>
  </div>          
</div>
{% endblock %}

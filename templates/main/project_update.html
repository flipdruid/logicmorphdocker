{% extends 'base.html' %}
{% load widget_tweaks %}
{% load crispy_forms_tags %}
{% block content %}

<div class="album py-1 bg-light">
  {% include 'main/inc/leftnav.html' %} 
    <div class="container">
      <div class = "row ">
        <div class = "col-lg-3"></div>
        <div class = "col-lg-6">
          <h2 class="text-center text-primary">PROJECT</h2>
          <form method="post" novalidate>
              {% csrf_token %}
              {{ form|crispy }}
              <div class="form-group text-center">
                  <button type="submit" class="btn btn-light border border-primary rounded" style="width: 90px;">
                    <i class="fa-regular fa-floppy-disk"></i></span> Save
                  </button>
                  <a href="{% url 'delete_client_project' projects.id %}" class="btn btn-light border border-primary rounded" style="width: 90px;"><i class="fa-solid fa-trash-can"></i> Delete</a>
                  {% if request.user.is_staff or request.user.is_superuser %}
                    <a href="{% url 'list_project' %}" class="btn btn-light border border-primary rounded" style="width: 90px;"><i class="fa-solid fa-left-long"></i> Back</a>
                  {% else %}
                  <a href="{% url 'list_client_project' %}" class="btn btn-light border border-primary rounded" style="width: 90px;"><i class="fa-solid fa-left-long"></i> Back</a>
                  {% endif %}
                  </div>
          </form>
        </div>
        <div class = "col-lg-3"></div>
    </div>
</div>



{% endblock %}

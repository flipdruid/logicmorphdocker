{% extends "base.html" %}
{% load crispy_forms_tags %}
{% load i18n %}

{% block content %}
<div class="row">
  <div class="col-lg-4"></div>
  <div class="col-lg-4 mt-2">
    <h3 class="text-center text-primary mt-2">CHANGE PASSWORD</h3>
    <form method="post" action="." class="mb-2">
      {% csrf_token %}
      {{ form|crispy }}

      <input type="submit" value="{% trans 'Submit' %}" />
    </form>
  </div>
  <div class="col-lg-4"></div>
</div>
{% endblock %}
